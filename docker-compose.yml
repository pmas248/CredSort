services:
  db:
    image: postgres:16-alpine
    container_name: credsort_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Abcd1234!
      POSTGRES_DB: credsort_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: